---
- git: https://github.com/osism/generics.git
  version: v0.20260929.0
  files:
    - src: gilt.yml
      dst: ./gilt.yml
    - src: requirements.txt
      dst: ./requirements.txt
    - src: Makefile
      dst: ./Makefile
    - src: environments/manager/images.yml
      dst: environments/manager/images.yml
    - src: environments/manager/run.sh
      dst: environments/manager/run.sh
    - src: environments/manager/ansible.cfg
      dst: environments/manager/ansible.cfg
    - src: environments/manager/requirements.*
      dst: environments/manager/
    - src: src/render-images.py
      dst: environments/manager/
      post_commands:
        - python3 render-images.py
        - rm render-images.py
    - src: src/set-versions.py
      dst: environments/
      post_commands:
        - python3 set-versions.py
        - rm set-versions.py
- git: https://github.com/osism/kolla-operations.git
  version: 291454627f26c434ed481c7e8b6940c13bec9a54
  files:
    # Grafana: dashboards (ceph/, infrastructure/, openstack/), home dashboard, provisioning
    - src: grafana/dashboards
      dst: environments/kolla/files/overlays/grafana/dashboards
    - src: grafana/grafana_home_dashboard.json
      dst: environments/kolla/files/overlays/grafana/grafana_home_dashboard.json
    - src: grafana/provisioning.yaml
      dst: environments/kolla/files/overlays/grafana/provisioning.yaml
    # Prometheus: alerting and recording rules
    - src: prometheus/*.rules
      dst: environments/kolla/files/overlays/prometheus/
